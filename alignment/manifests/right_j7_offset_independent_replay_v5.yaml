# Prepared only: physical execution requires a fresh explicit authorization.
trial_id: openarm_real_sim_right_j7_offset_independent_replay_v5
mode: measure
mapping_version: named-map-v1
joint_set: [openarm_right_joint7]
trajectory:
  reference: measured J7 start position
  waypoints_rad: [0.05, 0.0, -0.05, 0.0, 0.10, 0.0]
  repetitions: 3
  hold_s: 3.0
real_publish_hz: 50
max_excursion_rad: 0.15
max_substep_rad: 0.025
state_discovery:
  attempts_before_motion: 3
  seconds_per_attempt: 3.0
  on_failure: stop_router_and_abort_trial
gates:
  can0_and_can1_up_with_fresh_feedback: true
  all_motor_leds_green_operator_confirmed: true
  state_stale_s: 0.25
  sim_target_and_return_error_rad: 0.01
  one_active_command_publisher: true
  all_waypoints_require_accepted_real_and_sim_receipt: true
  no_prior_axis_in_same_router_session: true
  operator_stop: true
outputs:
  raw_directory: alignment/results/openarm_real_sim_right_j7_offset_independent_replay_v5
  comparison: prior J7 directional fit and held-out replay
  promotion_rule: enable J7 Isaac replay only if all gates pass and independent replay agrees
