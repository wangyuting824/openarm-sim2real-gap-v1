# Approval required before this manifest may enable or command hardware.
trial_id: openarm_real_sim_bimanual_offset_identification_v2
mode: measure
mapping_version: named-map-v1
real_target_topics:
  left: /left_forward_position_controller/commands
  right: /right_forward_position_controller/commands
sim_target_topic: /sim/openarm/timestamped_joint_command
real_state_topic: /joint_states
sim_state_topic: /sim/openarm/joint_states_v2
joint_set: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4, openarm_left_joint5, openarm_left_joint6, openarm_left_joint7, openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4, openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]
trajectory_per_joint:
  reference: measured joint start position
  standard_waypoints_rad: [0.05, 0.0, -0.05, 0.0, 0.10, 0.0]
  joint4_waypoints_rad: [0.05, 0.0, 0.10, 0.05, 0.0]
  hold_s: 3.0
  repetitions: 3
real_publish_hz: 50
max_excursion_rad: 0.15
max_substep_rad: 0.025
expected_duration_s: 900
gates:
  state_stale_s: 0.25
  sim_target_and_return_error_rad: 0.01
  out_of_limit: true
  one_active_command_publisher: true
  operator_stop: true
outputs:
  raw_directory: alignment/results/openarm_real_sim_bimanual_offset_identification_v2
  fit: q_real = a*q_sim + b + h(approach_direction)
  delay: estimate separately from timestamped ramp responses
  candidate_application: compare_or_replay_layer_only_until_held_out_validation
