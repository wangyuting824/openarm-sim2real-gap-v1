retry_reason: recorder_sim_tracking_gate_compared_nominal_not_emulated
authorization:
  real_authorization_required: true
  can_recovery_authorized: true
  motor_enable_authorized: true
  router_enable_real: true
  router_real_authorization_id: openarm_static_independent_session_v2
calibration_under_test:
